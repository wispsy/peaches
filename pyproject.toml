[project]
name = "peaches"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "A selected text workflow workbench over independent Python composition libraries."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = [
    "wispsy>=0.0.1",
    "scriptty>=0.1.0",
]

[project.optional-dependencies]
cli = ["scriptty[cli]>=0.1.0"]
sequence = ["scriptty[sequence]>=0.1.0 ; python_version >= '3.14'"]
terminal = ["scriptty[terminal]>=0.1.0 ; python_version >= '3.14'"]
table = ["wispsy[table]>=0.0.1 ; python_version >= '3.14'"]

[project.scripts]
peaches = "peaches.cli:main"

[project.urls]
Source = "https://github.com/wispsy/peaches"
Issues = "https://github.com/wispsy/peaches/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["LICENSE", "tests/*.py", "cli_tests/*.py", "profile_tests/*.py", "scripts/*.py", "docs/*.md"]
