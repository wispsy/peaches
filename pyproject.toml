[project]
name = "peaches"
version = "0.0.1.dev0"
description = "A selected text workflow workbench over independent Python composition libraries."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = [
    "wispsy @ git+https://github.com/wispsy/wispsy.git@bc23afa3f9ffa8669aef2cb713f8923bff98ea3d",
    "scriptty @ git+https://github.com/wispsy/scriptty.git@b6db2c6f0b5011ccab67bc790d72b9efa3cb34fd",
]

[project.optional-dependencies]
cli = ["scriptty[cli] @ git+https://github.com/wispsy/scriptty.git@b6db2c6f0b5011ccab67bc790d72b9efa3cb34fd"]
sequence = ["scriptty[sequence] @ git+https://github.com/wispsy/scriptty.git@b6db2c6f0b5011ccab67bc790d72b9efa3cb34fd ; python_version >= '3.14'"]
terminal = ["scriptty[terminal] @ git+https://github.com/wispsy/scriptty.git@b6db2c6f0b5011ccab67bc790d72b9efa3cb34fd ; python_version >= '3.14'"]
table = ["wispsy[table] @ git+https://github.com/wispsy/wispsy.git@bc23afa3f9ffa8669aef2cb713f8923bff98ea3d ; python_version >= '3.14'"]

[project.scripts]
peaches = "peaches.cli:main"

[project.urls]
Source = "https://github.com/wispsy/peaches"
Issues = "https://github.com/wispsy/peaches/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/*.py", "cli_tests/*.py", "profile_tests/*.py", "scripts/*.py", "docs/*.md"]
